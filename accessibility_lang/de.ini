menu_wii_help = Bluetooth-Wii-Fernbedienungen und Wii-U-Pro-Controller: Schalter, Suche und Kalibrierung des Beschleunigungssensors.
opt_port_help = Auf welchen der vier Spielanschlüsse sich die folgenden Zeilen beziehen. Links und rechts ändern ihn.
opt_assign_controller_help = Links und rechts wählen unter den angeschlossenen Controllern, A weist den gewählten diesem Anschluss zu.
opt_preset_gamecube_help = Stellt die GameCube-Tastenbelegung am Controller dieses Anschlusses wieder her.
opt_preset_classic_help = Stellt die Tasten des Controllers dieses Anschlusses auf die Belegung des Classic Controller Pro.
opt_preset_playstation_help = Stellt die Tasten des Controllers dieses Anschlusses auf die PlayStation-Belegung.
opt_vibration_help = Vibration für alle Anschlüsse.
opt_keyboard_mouse_help = Spielt an diesem Anschluss mit Tastatur und Maus statt mit einem Controller. Beim ersten Mal wird die WASD-Belegung gesetzt.
opt_wasd_preset_help = Setzt die Tasten von Tastatur und Maus auf die WASD-Belegung. Tastatur und Maus müssen eingeschaltet sein.
opt_wii_use_help = Erlaubt dem Spiel, Bluetooth-Wii-Fernbedienungen und Wii-U-Pro-Controller zu nutzen. Gilt ab dem nächsten Spielstart. Schalte es aus, wenn du eine Mayflash DolphinBar benutzt.
opt_wii_scan_help = Prüft alle zwei Sekunden das Bluetooth, solange kein Wii-Controller verbunden ist, damit eine ausgefallene oder spät eingeschaltete Fernbedienung von selbst zurückkommt.
opt_wii_rescan_help = Sucht jetzt nach Wii-Fernbedienungen. Drücke 1 und 2 an der Fernbedienung oder die rote Sync-Taste.
opt_wii_calibrate_help = Lege die Fernbedienung mit den Tasten nach oben auf eine ebene Fläche und berühre sie etwa zwei Sekunden lang nicht. Korrigiert den Lenkversatz einer seitlich gehaltenen Fernbedienung.
opt_wii_clear_calibration_help = Entfernt die gespeicherte Korrektur des Beschleunigungssensors.
opt_dolphin_import_help = Liest die Steuerung dieses Anschlusses aus den GameCube-Controller-Einstellungen von Dolphin und sagt, wie viele importiert wurden.
