# Mario Kart Wii Barrierefreiheits-Mod — deutsche Ansagen.
# Frei editierbar: schluessel = wert, UTF-8. {n}/{total}/{pos} setzt der Mod ein.
# Werte in "Anfuehrungszeichen" behalten fuehrende/abschliessende Leerzeichen.
# Fehlt ein Schluessel oder die Datei, gilt das eingebaute Englisch.

ready = Mario Kart Wii Barrierefreiheit bereit.
settings_reloaded = Einstellungen neu geladen

update_mod = Eine neue Version von Mario Kart Wii Access ist verfügbar. Drücke Enter, um jetzt zu aktualisieren, oder Escape, um weiterzuspielen.
update_retro_rewind = Eine neue Version von Retro Rewind ist verfügbar. Drücke Enter, um jetzt zu aktualisieren, oder Escape, um weiterzuspielen.
update_mod_manual = Eine neue Version von Mario Kart Wii Access ist verfügbar. Führe das Installationsprogramm im Spielordner aus, um zu aktualisieren.
update_retro_rewind_manual = Eine neue Version von Retro Rewind ist verfügbar. Führe das Installationsprogramm im Spielordner aus, um sie vor dem Onlinespiel zu aktualisieren.
update_declined = Es wird ohne Aktualisierung fortgefahren.
update_starting = Das Installationsprogramm wird gestartet. Das Spiel wird jetzt beendet.
update_failed = Das Installationsprogramm konnte nicht gestartet werden.

