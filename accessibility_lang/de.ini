# Beschreibungen: werden nach Name und Wert der Option vorgelesen
opt_mii_name_help = Der Name, den andere Spieler online sehen; dein Mii trägt ihn. A drücken, mit der Tastatur eingeben und Eingabetaste drücken.
opt_master_volume_help = Lautstärke des gesamten Spiels: Motor, Musik und Effekte zusammen. Die Sprachausgabe des Screenreaders ist davon nicht betroffen.
opt_music_volume_help = Nur die Hintergrundmusik. Motoren und Effekte behalten ihre eigene Lautstärke.
opt_kart_volume_help = Dein eigenes Kart: Motor, Drift und die Stimme deines Fahrers. Über hundert ist es lauter als im Originalspiel, das hilft dir, die Lenkhilfe zu hören, die darauf mitschwingt.
opt_rival_volume_help = Die Motoren und Stimmen der anderen Karts. Senke sie, damit das Feld dein eigenes Motorgeräusch nicht übertönt.
opt_roulette_volume_help = Das Drehen des Item-Rouletts und der Jingle, wenn dein Item feststeht. Menüklicks bleiben unverändert.
opt_edge_cue_volume_help = Die Pieptöne nahe am Straßenrand und der Dauerton, solange du neben der Strecke bist. Jeder Schritt spielt den Ton in der neuen Lautstärke.
opt_surface_cue_volume_help = Der Ton, wenn der Kart die Strecke verlässt, und der, wenn er zurückkommt. Jeder Schritt spielt ihn ab.
opt_curve_cue_volume_help = Die Pieptöne für Einfahrt, Scheitel und Ausfahrt einer Kurve. Jeder Schritt spielt einen ab.
opt_countdown_cue_volume_help = Die drei aufsteigenden Pieptöne, die eine Kurve einzählen. Jeder Schritt spielt einen ab.
opt_item_box_cue_volume_help = Der Piepser, der auf eine nahe Item-Box zeigt, solange du kein Item hast. Jeder Schritt spielt ihn ab.
opt_invert_pan_help = Aus: Der Motor klingt zu der Seite hin, von der du weglenken musst. An: das wird umgekehrt, sodass du zum Klang hin lenkst.
opt_steering_strength_help = Wie stark der Motor schwenkt, wenn das Kart von der Ideallinie abweicht. Erhöhe sie für einen breiteren, deutlicheren Ausschlag, senke sie für einen dezenteren.
opt_look_ahead_help = Wie weit der Mod zeitlich vorausschaut: eine Zehntelsekunde bei null, die im Spiel erprobten acht Zehntel bei hundert, etwa anderthalb Sekunden bei zweihundert. Erhöhe sie, um früher vor Kurven und vor dem Fahrbahnrand gewarnt zu werden, senke sie, um dem aktuellen Geschehen zu folgen.
opt_steering_lean_angle_help = Wie weit das Kart von der Ideallinie abweichen muss, bis der Motor seinen weitesten Schwenk erreicht. Senke ihn, und der Motor schwenkt in derselben Kurve weiter aus; erhöhe ihn für eine sanftere, allmählichere Neigung.
opt_edge_cues_help = Pieptöne, die schneller werden, je näher du dem Straßenrand kommst, und ein Dauerton, während du daneben bist. Schaltest du es aus, bleiben die gesprochenen Ansagen für Von-der-Strecke und Falsche Richtung erhalten.
demo_edge_help = Spielt den Dauerton ab, der ertönt, während das Kart neben der Strecke ist.
demo_curve_help = Spielt den Piepton ab, der eine bevorstehende Kurve markiert.
demo_itembox_help = Spielt den Ton ab, der auf eine nahe Itembox hinweist, während deine Hände leer sind.

