# Beschreibungen: werden nach Name und Wert der Option vorgelesen
opt_master_volume_help = Lautstärke des gesamten Spiels: Motor, Musik und Effekte zusammen. Die Sprachausgabe des Screenreaders ist davon nicht betroffen.
opt_music_volume_help = Nur die Hintergrundmusik. Motoren und Effekte behalten ihre eigene Lautstärke.
opt_kart_volume_help = Dein eigenes Kart: Motor, Drift und die Stimme deines Fahrers. Über hundert ist es lauter als im Originalspiel, das hilft dir, die Lenkhilfe zu hören, die darauf mitschwingt.
opt_rival_volume_help = Die Motoren und Stimmen der anderen Karts. Senke sie, damit das Feld dein eigenes Motorgeräusch nicht übertönt.
opt_roulette_volume_help = Das Drehen des Item-Rouletts und der Jingle, wenn dein Item feststeht. Menüklicks bleiben unverändert.
opt_invert_pan_help = Aus: Der Motor klingt zu der Seite hin, von der du weglenken musst. An: das wird umgekehrt, sodass du zum Klang hin lenkst.
opt_edge_cues_help = Pieptöne, die schneller werden, je näher du dem Straßenrand kommst, und ein Dauerton, während du daneben bist. Schaltest du es aus, bleiben die gesprochenen Ansagen für Von-der-Strecke und Falsche Richtung erhalten.
demo_edge_help = Spielt den Dauerton ab, der ertönt, während das Kart neben der Strecke ist.
demo_curve_help = Spielt den Piepton ab, der eine bevorstehende Kurve markiert.
demo_itembox_help = Spielt den Ton ab, der auf eine nahe Itembox hinweist, während deine Hände leer sind.

