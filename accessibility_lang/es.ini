opt_wii_scan = seguir buscando mandos de Wii
opt_wii_rescan = buscar mandos de Wii ahora
opt_wii_calibrate = calibrar el acelerómetro
opt_wii_clear_calibration = borrar la calibración
opt_dolphin_import = importar los controles de Dolphin
menu_wii_help = Mandos de Wii y Wii U Pro por Bluetooth: interruptores, búsqueda y calibración del acelerómetro.
opt_port_help = Sobre cuál de los cuatro puertos del juego actúan las opciones siguientes. Izquierda y derecha lo cambian.
opt_assign_controller_help = Izquierda y derecha eligen entre los mandos conectados; A pone el elegido en este puerto.
opt_preset_gamecube_help = Restaura la disposición de botones de GameCube en el mando de este puerto.
opt_preset_classic_help = Pone los botones del mando de este puerto con la disposición del Classic Controller Pro.
opt_preset_playstation_help = Pone los botones del mando de este puerto con la disposición de PlayStation.
opt_vibration_help = Vibración en todos los puertos.
opt_keyboard_mouse_help = Juega con el teclado y el ratón en este puerto en lugar de con un mando. La primera vez pone la disposición WASD.
opt_wasd_preset_help = Pone las teclas del teclado y el ratón con la disposición WASD. Requiere tener activado el teclado y ratón.
opt_wii_use_help = Permite al juego usar mandos de Wii y Wii U Pro por Bluetooth. Se aplica la próxima vez que inicies el juego. Desactívalo si usas una Mayflash DolphinBar.
opt_wii_scan_help = Mientras no haya ningún mando de Wii conectado, revisa el Bluetooth cada dos segundos, de modo que un mando que se haya desconectado o encendido tarde vuelve solo.
opt_wii_rescan_help = Busca mandos de Wii ahora. Pulsa 1 y 2 en el mando, o el botón rojo de sincronización.
opt_wii_calibrate_help = Deja el mando sobre una superficie plana con los botones hacia arriba y no lo toques durante unos dos segundos. Corrige el desvío de la dirección de un mando sostenido de lado.
opt_wii_clear_calibration_help = Elimina la corrección guardada del acelerómetro.
opt_dolphin_import_help = Lee los controles de este puerto de la configuración de mandos de GameCube de Dolphin y dice cuántos se importaron.
