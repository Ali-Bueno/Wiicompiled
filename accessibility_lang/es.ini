# settings menu
menu_opened = ajustes de accesibilidad. Arriba y abajo para elegir, izquierda y derecha para ajustar, A para activar, B para cerrar.
menu_closed = ajustes cerrados
menu_race_blocked = los ajustes se abren desde los menús, no durante la carrera
opt_master_volume = volumen general
opt_music_volume = volumen de la música
opt_steering_strength = fuerza de la guía de dirección
opt_look_ahead = anticipación
opt_invert_pan = invertir el paneo
opt_edge_cues = avisos de borde
demo_edge = escuchar el tono de borde
demo_curve = escuchar un pitido de curva
demo_itembox = escuchar la caja de ítems
value_on = activado
value_off = desactivado
percent = {n} por ciento
opt_kart_volume = volumen de mi kart
opt_rival_volume = volumen de los karts rivales
opt_roulette_volume = volumen de la ruleta de ítems

# descripciones: se leen después del nombre y el valor de cada opción
opt_master_volume_help = Volumen de todo el juego: motor, música y efectos juntos. La voz del lector de pantalla no se ve afectada.
opt_music_volume_help = Solo la música de fondo. Los motores y los efectos mantienen su propio volumen.
opt_kart_volume_help = Tu propio kart: motor, derrape y la voz de tu piloto. Por encima de cien suena más fuerte que en el juego original, lo que ayuda a oír la guía de dirección que viaja sobre él.
opt_rival_volume_help = Los motores y las voces de los demás karts. Bájalo para que el grupo no tape tu propio motor.
opt_roulette_volume_help = El giro de la ruleta de ítems y el sonido de cuando se decide tu ítem. Los clics de los menús no se tocan.
opt_steering_strength_help = Cuánto se va el motor hacia un lado cuando el kart apunta fuera de la trazada. Es la parte principal de la guía: súbelo para un barrido más amplio y evidente, bájalo para uno más sutil.
opt_look_ahead_help = Cuánto tiempo por delante mira el mod, desde una décima de segundo hasta unas ocho décimas. Súbelo para que te avise antes de las curvas y del borde de la pista, bájalo para seguir lo que pasa justo ahora.
opt_invert_pan_help = Desactivado, el motor suena hacia el lado del que tienes que apartarte. Activado se invierte, y conduces hacia el sonido.
opt_edge_cues_help = Pitidos que se aceleran al acercarte al borde de la carretera, y un tono sostenido mientras estás fuera. Desactivarlo mantiene los avisos hablados de fuera de pista y sentido contrario.
demo_edge_help = Reproduce el tono sostenido que suena mientras el kart está fuera de la pista.
demo_curve_help = Reproduce el pitido que marca una curva próxima.
demo_itembox_help = Reproduce el aviso que señala una caja de ítems cercana cuando vas sin ítem.

