opt_resolution_help = Cuán nítida se ve la imagen. Los pasos de 6x y 8x no están disponibles mientras la interpolación de fotogramas está activada.
opt_disable_bloom_help = Quita el efecto de brillo alrededor de las zonas claras. Se aplica a partir de la siguiente escena.
opt_display_mode_help = Ventana, pantalla completa sin bordes o pantalla completa exclusiva. Si no se puede cambiar de modo, se mantiene el anterior.
opt_frame_interp_help = Suaviza la carrera con fotogramas extra. Es experimental y puede mostrar fallos visuales. Al activarla, una resolución de 6x u 8x baja a 4x.
opt_disable_copy_filter_help = Omite el paso del filtro de copia del juego al dibujar la imagen.
opt_skip_unready_help = Deja sin dibujar los objetos cuyos shaders aún se compilan, en vez de pausar el juego. Aparecen un momento después.
