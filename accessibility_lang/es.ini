# descripciones: se leen después del nombre y el valor de cada opción
opt_mii_name_help = El nombre que ven los demás jugadores en línea; tu Mii lo lleva. Pulsa A, escríbelo con el teclado y pulsa Intro.
opt_master_volume_help = Volumen de todo el juego: motor, música y efectos juntos. La voz del lector de pantalla no se ve afectada.
opt_music_volume_help = Solo la música de fondo. Los motores y los efectos mantienen su propio volumen.
opt_kart_volume_help = Tu propio kart: motor, derrape y la voz de tu piloto. Por encima de cien suena más fuerte que en el juego original, lo que ayuda a oír la guía de dirección que viaja sobre él.
opt_rival_volume_help = Los motores y las voces de los demás karts. Bájalo para que el grupo no tape tu propio motor.
opt_roulette_volume_help = El giro de la ruleta de ítems y el sonido de cuando se decide tu ítem. Los clics de los menús no se tocan.
opt_edge_cue_volume_help = Los pitidos cerca del borde de la carretera y el tono sostenido mientras estás fuera. Cada paso reproduce el tono al nuevo nivel.
opt_surface_cue_volume_help = La nota de cuando el kart sale de la pista y la de cuando vuelve. Cada paso la reproduce.
opt_curve_cue_volume_help = Los pitidos que marcan la entrada, el vértice y la salida de una curva. Cada paso reproduce uno.
opt_countdown_cue_volume_help = Los tres pitidos ascendentes que cuentan la llegada de una curva. Cada paso reproduce uno.
opt_item_box_cue_volume_help = El aviso que señala una caja de ítems cercana cuando vas sin ítem. Cada paso lo reproduce.
opt_trick_ramp_cue_volume_help = El pitido ascendente que señala la próxima rampa o seta saltarina donde puedes hacer un truco. Cada paso lo reproduce.
opt_invert_pan_help = Desactivado, el motor suena hacia el lado del que tienes que apartarte. Activado se invierte, y conduces hacia el sonido.
opt_steering_strength_help = Cuánto se va el motor hacia un lado cuando el kart apunta fuera de la trazada. Súbelo para un barrido más amplio y evidente, bájalo para uno más sutil.
opt_look_ahead_help = Cuánto tiempo por delante mira el mod: una décima de segundo en cero, las ocho décimas probadas en juego en cien y alrededor de segundo y medio en doscientos. Súbelo para que te avise antes de las curvas y del borde de la pista, bájalo para seguir lo que pasa justo ahora.
opt_steering_lean_angle_help = Cuánto tiene que desviarse el kart de la trazada para que el motor llegue a su paneo máximo. Bájalo y el motor se va más a los lados en la misma curva; súbelo para una inclinación más suave y gradual.
opt_edge_cues_help = Pitidos que se aceleran al acercarte al borde de la carretera, y un tono sostenido mientras estás fuera. Desactivarlo mantiene los avisos hablados de fuera de pista y sentido contrario.
demo_edge_help = Reproduce el tono sostenido que suena mientras el kart está fuera de la pista.
demo_curve_help = Reproduce el pitido que marca una curva próxima.
demo_itembox_help = Reproduce el aviso que señala una caja de ítems cercana cuando vas sin ítem.
demo_trickramp_help = Reproduce el pitido ascendente que señala la próxima rampa o seta donde puedes hacer un truco.

