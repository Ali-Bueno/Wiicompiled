curve_gentle_left = suave izquierda
curve_gentle_right = suave derecha
curve_gentle_left_long = suave izquierda larga
curve_gentle_right_long = suave derecha larga
curve_hard_left = cerrada izquierda
curve_hard_right = cerrada derecha
curve_hard_left_long = cerrada izquierda larga
curve_hard_right_long = cerrada derecha larga
curve_hairpin_left = horquilla izquierda
curve_hairpin_right = horquilla derecha
curve_hairpin_left_long = horquilla izquierda larga
curve_hairpin_right_long = horquilla derecha larga
curve_then = ", luego "

position_1 = puesto {n}
position_2 = puesto {n}
position_3 = puesto {n}
