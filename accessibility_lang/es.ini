# Mod de accesibilidad de Mario Kart Wii — frases en español.
# Edita con libertad: clave = valor, UTF-8. {n}/{total}/{pos} los rellena el mod.
# Envuelve un valor en "comillas dobles" para conservar espacios al inicio o al final.
# Si falta una clave o el archivo, se usa el inglés integrado.

ready = Accesibilidad de Mario Kart Wii lista.
settings_reloaded = ajustes recargados

update_mod = Hay una nueva versión de Mario Kart Wii Access. Pulsa Intro para actualizar ahora, o Escape para seguir jugando.
update_retro_rewind = Hay una nueva versión de Retro Rewind. Pulsa Intro para actualizar ahora, o Escape para seguir jugando.
update_mod_manual = Hay una nueva versión de Mario Kart Wii Access. Ejecuta el instalador en la carpeta del juego para actualizar.
update_retro_rewind_manual = Hay una nueva versión de Retro Rewind. Ejecuta el instalador en la carpeta del juego para actualizarla antes de jugar en línea.
update_declined = Se continúa sin actualizar.
update_starting = Iniciando el actualizador. El juego se cerrará ahora.
update_failed = No se pudo iniciar el actualizador.

