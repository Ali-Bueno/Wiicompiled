# Mario Kart Wii accessibility mod — English phrases.
# Edit freely: key = value, UTF-8. {n}/{total}/{pos} are filled in by the mod.
# Wrap a value in "double quotes" to keep leading/trailing spaces.
# A missing key or file falls back to the built-in English default.

