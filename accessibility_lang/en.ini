# settings menu
menu_opened = accessibility settings. Up and down to choose, left and right to adjust, A to activate, B to close.
menu_closed = settings closed
menu_race_blocked = settings open from the menus, not during a race
opt_master_volume = master volume
opt_music_volume = music volume
opt_invert_pan = invert steering pan
opt_edge_cues = edge cues
demo_edge = hear the edge tone
demo_curve = hear a curve beep
demo_itembox = hear the item box
value_on = on
value_off = off
percent = {n} percent
opt_kart_volume = my kart volume
opt_rival_volume = rival karts volume
opt_roulette_volume = item roulette volume

# option descriptions: spoken after the row's name and value
opt_master_volume_help = Volume of the whole game: engine, music and effects together. Screen reader speech is not affected.
opt_music_volume_help = Background music only. Engines and effects keep their own volume.
opt_kart_volume_help = Your own kart: engine, drift and your driver's voice. Above one hundred it is louder than the original game, which helps you hear the steering guide that rides on it.
opt_rival_volume_help = The other karts' engines and voices. Lower it to stop the pack covering your own engine.
opt_roulette_volume_help = The item roulette spin and the jingle when your item is decided. Menu clicks are left alone.
opt_invert_pan_help = Off, the engine sounds toward the side you must steer away from. On flips it, so you steer toward the sound.
opt_edge_cues_help = Beeps that quicken as you near the edge of the road, and a held tone while you are off it. Turning it off keeps the spoken off road and wrong way calls.
demo_edge_help = Plays the held tone that sounds while the kart is off the road.
demo_curve_help = Plays the beep that marks a corner coming up.
demo_itembox_help = Plays the blip that points at a nearby item box while your hands are empty.

