# option descriptions: spoken after the row's name and value
opt_mii_name_help = The name other players see online; your Mii carries it. Press A, type it on the keyboard and press Enter.
opt_master_volume_help = Volume of the whole game: engine, music and effects together. Screen reader speech is not affected.
opt_music_volume_help = Background music only. Engines and effects keep their own volume.
opt_kart_volume_help = Your own kart: engine, drift and your driver's voice. Above one hundred it is louder than the original game, which helps you hear the steering guide that rides on it.
opt_rival_volume_help = The other karts' engines and voices. Lower it to stop the pack covering your own engine.
opt_roulette_volume_help = The item roulette spin and the jingle when your item is decided. Menu clicks are left alone.
opt_edge_cue_volume_help = The beeps near the edge of the road and the held tone while off it. Every step plays the tone at the new level.
opt_surface_cue_volume_help = The note when the kart leaves the road and the one when it comes back. Every step plays it.
opt_curve_cue_volume_help = The beeps that mark a corner's entry, apex and exit. Every step plays one.
opt_countdown_cue_volume_help = The three rising beeps that count a corner in. Every step plays one.
opt_item_box_cue_volume_help = The blip that points at a nearby item box while your hands are empty. Every step plays it.
opt_trick_ramp_cue_volume_help = The rising blip that points at the next ramp or bouncy mushroom you can trick off. Every step plays it.
opt_invert_pan_help = Off, the engine sounds toward the side you must steer away from. On flips it, so you steer toward the sound.
opt_steering_strength_help = How hard the engine pans when the kart points away from the racing line. Raise it for a wider, more obvious swing, lower it for a subtler one.
opt_look_ahead_help = How far ahead in time the mod looks: a tenth of a second at zero, the play-tested eight tenths at one hundred, about a second and a half at two hundred. Raise it to be warned of corners and of the road edge earlier, lower it to follow what is happening right now.
opt_steering_lean_angle_help = How far off the racing line the kart has to point before the engine is at its widest pan. Lower it and the engine swings wider for the same corner; raise it for a softer, more gradual lean.
opt_edge_cues_help = Beeps that quicken as you near the edge of the road, and a held tone while you are off it. Turning it off keeps the spoken off road and wrong way calls.
demo_edge_help = Plays the held tone that sounds while the kart is off the road.
demo_curve_help = Plays the beep that marks a corner coming up.
demo_itembox_help = Plays the blip that points at a nearby item box while your hands are empty.
demo_trickramp_help = Plays the rising blip that points at the next ramp or mushroom you can trick off.

