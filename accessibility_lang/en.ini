menu_wii_help = Bluetooth Wii Remotes and Wii U Pro Controllers: switches, scanning and accelerometer calibration.
opt_port_help = Which of the four game ports the rows below act on. Left and right change it.
opt_assign_controller_help = Left and right choose among the connected controllers, A puts the chosen one on this port.
opt_preset_gamecube_help = Restores the GameCube button layout on this port's controller.
opt_preset_classic_help = Sets the buttons of this port's controller to the Classic Controller Pro layout.
opt_preset_playstation_help = Sets the buttons of this port's controller to the PlayStation layout.
opt_vibration_help = Rumble for every port.
opt_keyboard_mouse_help = Plays with the keyboard and mouse on this port instead of a controller. The first time, it sets the WASD layout.
opt_wasd_preset_help = Sets the keyboard and mouse keys to the WASD layout. Needs keyboard and mouse turned on.
opt_wii_use_help = Lets the game use Bluetooth Wii Remotes and Wii U Pro Controllers. Takes effect the next time you start the game. Turn it off if you use a Mayflash DolphinBar.
opt_wii_scan_help = While no Wii controller is connected, checks Bluetooth every two seconds, so a remote that dropped out or was switched on late comes back by itself.
opt_wii_rescan_help = Looks for Wii Remotes now. Press 1 and 2 on the remote, or the red sync button.
opt_wii_calibrate_help = Put the remote on a flat surface with the buttons facing up and do not touch it for about two seconds. Corrects the steering offset of a remote held sideways.
opt_wii_clear_calibration_help = Removes the stored accelerometer correction.
opt_dolphin_import_help = Reads this port's controls from Dolphin's GameCube pad settings and says how many were imported.
