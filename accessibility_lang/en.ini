opt_resolution_help = How sharp the picture is. The 6x and 8x steps are not available while frame interpolation is on.
opt_disable_bloom_help = Turns off the glow effect around bright areas. Applies from the next scene.
opt_display_mode_help = Window, borderless fullscreen or exclusive fullscreen. If the mode cannot be set, the old one stays.
opt_frame_interp_help = Smooths the race with extra frames. Experimental, it may show visual glitches. Choosing it lowers 6x or 8x resolution to 4x.
opt_disable_copy_filter_help = Skips the game's copy filter pass when it draws the picture.
opt_skip_unready_help = Leaves out objects whose shaders are still compiling instead of pausing the game. They pop in a moment later.
