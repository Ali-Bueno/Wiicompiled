# Mario Kart Wii accessibility mod — English phrases.
# Edit freely: key = value, UTF-8. {n}/{total}/{pos} are filled in by the mod.
# Wrap a value in "double quotes" to keep leading/trailing spaces.
# A missing key or file falls back to the built-in English default.

ready = Mario Kart Wii accessibility ready.
settings_reloaded = settings reloaded

update_mod = A new Mario Kart Wii Access version is available. Press Enter to update now, or Escape to keep playing.
update_retro_rewind = A new Retro Rewind version is available. Press Enter to update now, or Escape to keep playing.
update_mod_manual = A new Mario Kart Wii Access version is available. Run the installer in your game folder to update.
update_retro_rewind_manual = A new Retro Rewind version is available. Run the installer in your game folder to update it before playing online.
update_declined = Continuing without updating.
update_starting = Starting the updater. The game will close now.
update_failed = The updater could not be started.

