# Mod d'accessibilité Mario Kart Wii — phrases en français.
# Modifiable librement : clé = valeur, UTF-8. {n}/{total}/{pos} sont remplis par le mod.
# Entourez une valeur de "guillemets doubles" pour garder les espaces de début ou de fin.
# Une clé ou un fichier manquant retombe sur l'anglais intégré.

ready = Accessibilité Mario Kart Wii prête.
settings_reloaded = réglages rechargés

update_mod = Une nouvelle version de Mario Kart Wii Access est disponible. Appuie sur Entrée pour mettre à jour maintenant, ou sur Échap pour continuer à jouer.
update_retro_rewind = Une nouvelle version de Retro Rewind est disponible. Appuie sur Entrée pour mettre à jour maintenant, ou sur Échap pour continuer à jouer.
update_mod_manual = Une nouvelle version de Mario Kart Wii Access est disponible. Lance l’installateur dans le dossier du jeu pour mettre à jour.
update_retro_rewind_manual = Une nouvelle version de Retro Rewind est disponible. Lance l’installateur dans le dossier du jeu pour la mettre à jour avant de jouer en ligne.
update_declined = On continue sans mettre à jour.
update_starting = Démarrage de l’installateur. Le jeu va se fermer.
update_failed = Impossible de démarrer l’installateur.

