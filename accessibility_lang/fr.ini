# descriptions : lues après le nom et la valeur de chaque option
opt_mii_name_help = Le nom que voient les autres joueurs en ligne ; votre Mii le porte. Appuyez sur A, tapez-le au clavier et appuyez sur Entrée.
opt_master_volume_help = Volume de tout le jeu : moteur, musique et effets ensemble. La voix du lecteur d'écran n'est pas affectée.
opt_music_volume_help = Uniquement la musique de fond. Les moteurs et les effets gardent leur propre volume.
opt_kart_volume_help = Ton propre kart : moteur, dérapage et la voix de ton pilote. Au-dessus de cent, il est plus fort que dans le jeu original, ce qui t'aide à entendre le guide de direction porté par ce son.
opt_rival_volume_help = Les moteurs et les voix des autres karts. Baisse-le pour empêcher le peloton de couvrir ton propre moteur.
opt_roulette_volume_help = Le tirage de la roulette d'objets et le jingle quand ton objet est déterminé. Les clics de menu ne sont pas concernés.
opt_edge_cue_volume_help = Les bips près du bord de la route et le son continu tant que tu es hors piste. Chaque pas joue le son au nouveau niveau.
opt_surface_cue_volume_help = La note quand le kart quitte la piste et celle quand il y revient. Chaque pas la joue.
opt_curve_cue_volume_help = Les bips qui marquent l'entrée, le sommet et la sortie d'un virage. Chaque pas en joue un.
opt_countdown_cue_volume_help = Les trois bips montants qui annoncent l'arrivée d'un virage. Chaque pas en joue un.
opt_item_box_cue_volume_help = Le bip qui indique une boîte d'objets proche quand tu n'as pas d'objet. Chaque pas le joue.
opt_trick_ramp_cue_volume_help = Le bip montant qui indique la prochaine rampe ou le prochain champignon rebondissant où tu peux faire une figure. Chaque pas le joue.
opt_invert_pan_help = Désactivé, le moteur sonne du côté d'où tu dois t'écarter en braquant. Activé, cela s'inverse, tu braques alors vers le son.
opt_steering_strength_help = À quel point le moteur panote quand le kart ne pointe plus vers la ligne idéale. Augmente-la pour un mouvement plus large et plus net, baisse-la pour un effet plus discret.
opt_look_ahead_help = À quel point le mod anticipe dans le temps : un dixième de seconde à zéro, les huit dixièmes testés en jeu à cent, environ une seconde et demie à deux cents. Augmente-le pour être prévenu plus tôt des virages et du bord de la piste, baisse-le pour suivre ce qui se passe à l'instant présent.
opt_steering_lean_angle_help = De combien le kart doit s'écarter de la ligne idéale pour que le moteur atteigne son panoramique maximal. Baisse-le et le moteur s'écarte davantage dans le même virage ; monte-le pour une inclinaison plus douce et progressive.
opt_edge_cues_help = Des bips qui s'accélèrent quand tu approches du bord de la route, et un son continu tant que tu es hors piste. Le désactiver garde les annonces vocales hors piste et mauvais sens.
demo_edge_help = Joue le son continu qui retentit quand le kart est hors piste.
demo_curve_help = Joue le bip qui signale un virage à venir.
demo_itembox_help = Joue le bip qui indique une boîte à objets proche quand tes mains sont vides.
demo_trickramp_help = Joue le bip montant qui indique la prochaine rampe ou le prochain champignon où tu peux faire une figure.

