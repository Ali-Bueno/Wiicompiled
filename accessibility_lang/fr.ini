menu_steering_help = Comment le moteur se déplace pour te guider le long de la trajectoire.
menu_cues_help = Les bips et tonalités ajoutés par le mod, leurs volumes et un aperçu de chacun.
menu_sound_help = Les volumes du jeu, ton kart, les rivaux et la roulette d'objets.
opt_effects_volume_help = Moteurs, objets et autres effets de la course.
opt_ui_volume_help = Les clics et jingles des menus du jeu.
opt_voices_volume_help = Les voix des pilotes.
opt_mute_help = Coupe tout le son du jeu. La voix du lecteur d'écran et les signaux du mod continuent.
opt_external_media_help = Baisse la musique du jeu pendant qu'un autre programme joue de la musique ou une vidéo.
opt_mix_worker_help = Mixe le son du jeu dans son propre fil. Désactive-le si le son saute.

