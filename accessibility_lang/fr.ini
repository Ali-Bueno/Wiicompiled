opt_resolution_help = La netteté de l'image. Les paliers 6x et 8x ne sont pas disponibles tant que l'interpolation d'images est activée.
opt_disable_bloom_help = Supprime l'effet de halo autour des zones lumineuses. S'applique à partir de la scène suivante.
opt_display_mode_help = Fenêtre, plein écran sans bordure ou plein écran exclusif. Si le mode ne peut pas être appliqué, l'ancien est conservé.
opt_frame_interp_help = Fluidifie la course avec des images supplémentaires. Expérimental, des défauts visuels sont possibles. Une résolution de 6x ou 8x passe alors à 4x.
opt_disable_copy_filter_help = Ignore la passe du filtre de copie du jeu lors du dessin de l'image.
opt_skip_unready_help = Omet les objets dont les shaders sont encore en compilation au lieu de mettre le jeu en pause. Ils apparaissent un instant plus tard.
opt_port = port de manette
opt_assign_controller = assigner une manette connectée
opt_unassign = retirer la manette
opt_preset_gamecube = disposition GameCube
opt_preset_classic = disposition Classic Controller Pro
opt_preset_playstation = disposition PlayStation
opt_vibration = vibration de la manette
