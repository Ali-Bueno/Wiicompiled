# Mod d'accessibilité Mario Kart Wii — phrases en français.
# Modifiable librement : clé = valeur, UTF-8. {n}/{total}/{pos} sont remplis par le mod.
# Entourez une valeur de "guillemets doubles" pour garder les espaces de début ou de fin.
# Une clé ou un fichier manquant retombe sur l'anglais intégré.

ready = Accessibilité Mario Kart Wii prête.
settings_reloaded = réglages rechargés

curve_left = gauche
curve_right = droite
curve_left_long = gauche longue
curve_right_long = droite longue
curve_gentle_left = gauche légère
curve_gentle_right = droite légère
curve_gentle_left_long = gauche légère longue
curve_gentle_right_long = droite légère longue
curve_hard_left = gauche serrée
curve_hard_right = droite serrée
curve_hard_left_long = gauche serrée longue
curve_hard_right_long = droite serrée longue
curve_hairpin_left = épingle à gauche
curve_hairpin_right = épingle à droite
curve_hairpin_left_long = épingle à gauche longue
curve_hairpin_right_long = épingle à droite longue
curve_then = ", puis "

position_1 = position {n}
position_2 = position {n}
position_3 = position {n}
position_other = position {n}

lap = tour {n} sur {total}
finish = arrivée
finish_position = arrivée, {pos}

off_road = hors piste
off_road_fall = hors piste, bord du vide
on_road = sur la piste
wrong_way = sens inverse

# settings menu
menu_opened = réglages d'accessibilité. Haut et bas pour choisir, gauche et droite pour ajuster, A pour activer, B pour fermer.
menu_closed = réglages fermés
menu_race_blocked = les réglages s'ouvrent depuis les menus, pas pendant la course
opt_master_volume = volume général
opt_music_volume = volume de la musique
opt_steering_strength = force du guide de direction
opt_steering_sensitivity = sensibilité de la direction
opt_look_ahead = anticipation du guide
opt_position_gain = gain d ecart lateral
opt_curve_accent = accentuation de courbe
opt_pan_curve = courbe de réponse du panoramique
opt_curve_look_ahead = anticipation de l'annonce de virage
opt_invert_pan = inverser le panoramique
opt_edge_cues = signaux de bord
demo_edge = écouter le son de bord
demo_curve = écouter un bip de virage
demo_itembox = écouter la boîte à objets
value_on = activé
value_off = désactivé
percent = {n} pour cent
opt_kart_volume = volume de mon kart
opt_rival_volume = volume des karts rivaux
opt_roulette_volume = volume de la roulette d'objets
