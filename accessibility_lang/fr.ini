# settings menu
menu_opened = réglages d'accessibilité. Haut et bas pour choisir, gauche et droite pour ajuster, A pour activer, B pour fermer.
menu_closed = réglages fermés
menu_race_blocked = les réglages s'ouvrent depuis les menus, pas pendant la course
opt_master_volume = volume général
opt_music_volume = volume de la musique
opt_steering_strength = force du guide de direction
opt_look_ahead = anticipation
opt_invert_pan = inverser le panoramique
opt_edge_cues = signaux de bord
demo_edge = écouter le son de bord
demo_curve = écouter un bip de virage
demo_itembox = écouter la boîte à objets
value_on = activé
value_off = désactivé
percent = {n} pour cent
opt_kart_volume = volume de mon kart
opt_rival_volume = volume des karts rivaux
opt_roulette_volume = volume de la roulette d'objets

# descriptions : lues après le nom et la valeur de chaque option
opt_master_volume_help = Volume de tout le jeu : moteur, musique et effets ensemble. La voix du lecteur d'écran n'est pas affectée.
opt_music_volume_help = Uniquement la musique de fond. Les moteurs et les effets gardent leur propre volume.
opt_kart_volume_help = Ton propre kart : moteur, dérapage et la voix de ton pilote. Au-dessus de cent, il est plus fort que dans le jeu original, ce qui t'aide à entendre le guide de direction porté par ce son.
opt_rival_volume_help = Les moteurs et les voix des autres karts. Baisse-le pour empêcher le peloton de couvrir ton propre moteur.
opt_roulette_volume_help = Le tirage de la roulette d'objets et le jingle quand ton objet est déterminé. Les clics de menu ne sont pas concernés.
opt_steering_strength_help = À quel point le moteur panote quand le kart ne pointe plus vers la ligne idéale. C'est la partie principale du guide : augmente-la pour un mouvement plus large et plus net, baisse-la pour un effet plus discret.
opt_look_ahead_help = À quel point le mod anticipe dans le temps, d'un dixième de seconde jusqu'à environ huit dixièmes. Augmente-le pour être prévenu plus tôt des virages et du bord de la piste, baisse-le pour suivre ce qui se passe à l'instant présent.
opt_invert_pan_help = Désactivé, le moteur sonne du côté d'où tu dois t'écarter en braquant. Activé, cela s'inverse, tu braques alors vers le son.
opt_edge_cues_help = Des bips qui s'accélèrent quand tu approches du bord de la route, et un son continu tant que tu es hors piste. Le désactiver garde les annonces vocales hors piste et mauvais sens.
demo_edge_help = Joue le son continu qui retentit quand le kart est hors piste.
demo_curve_help = Joue le bip qui signale un virage à venir.
demo_itembox_help = Joue le bip qui indique une boîte à objets proche quand tes mains sont vides.

