opt_wasd_preset = disposition WASD et souris
menu_wii = Wiimotes
opt_wii_use = utiliser les Wiimotes
opt_wii_scan = continuer à chercher des Wiimotes
opt_wii_rescan = chercher des Wiimotes maintenant
opt_wii_calibrate = calibrer l'accéléromètre
opt_wii_clear_calibration = effacer la calibration
opt_dolphin_import = importer les commandes de Dolphin
menu_wii_help = Wiimotes et manettes Wii U Pro en Bluetooth : options, recherche et calibration de l'accéléromètre.
opt_port_help = Sur lequel des quatre ports du jeu portent les lignes suivantes. Gauche et droite le changent.
opt_assign_controller_help = Gauche et droite choisissent parmi les manettes connectées ; A place celle choisie sur ce port.
opt_preset_gamecube_help = Rétablit la disposition des boutons GameCube sur la manette de ce port.
opt_preset_classic_help = Règle les boutons de la manette de ce port sur la disposition du Classic Controller Pro.
opt_preset_playstation_help = Règle les boutons de la manette de ce port sur la disposition PlayStation.
opt_vibration_help = Vibration pour tous les ports.
opt_keyboard_mouse_help = Joue au clavier et à la souris sur ce port à la place d'une manette. La première fois, la disposition WASD est appliquée.
opt_wasd_preset_help = Règle les touches du clavier et de la souris sur la disposition WASD. Le clavier et la souris doivent être activés.
opt_wii_use_help = Permet au jeu d'utiliser des Wiimotes et des manettes Wii U Pro en Bluetooth. Pris en compte au prochain lancement du jeu. Désactive-le si tu utilises une Mayflash DolphinBar.
opt_wii_scan_help = Tant qu'aucune manette Wii n'est connectée, vérifie le Bluetooth toutes les deux secondes, pour qu'une Wiimote déconnectée ou allumée tardivement revienne toute seule.
opt_wii_rescan_help = Cherche des Wiimotes maintenant. Appuie sur 1 et 2 de la Wiimote, ou sur le bouton rouge de synchronisation.
opt_wii_calibrate_help = Pose la Wiimote à plat, boutons vers le haut, et ne la touche pas pendant environ deux secondes. Corrige le décalage de direction d'une Wiimote tenue à l'horizontale.
opt_wii_clear_calibration_help = Supprime la correction enregistrée de l'accéléromètre.
opt_dolphin_import_help = Lit les commandes de ce port dans les réglages de manette GameCube de Dolphin et indique combien ont été importées.
