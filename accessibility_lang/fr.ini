# Mod d'accessibilité Mario Kart Wii — phrases en français.
# Modifiable librement : clé = valeur, UTF-8. {n}/{total}/{pos} sont remplis par le mod.
# Entourez une valeur de "guillemets doubles" pour garder les espaces de début ou de fin.
# Une clé ou un fichier manquant retombe sur l'anglais intégré.

ready = Accessibilité Mario Kart Wii prête.
settings_reloaded = réglages rechargés

curve_left = gauche
curve_right = droite
curve_left_long = gauche longue
curve_right_long = droite longue
curve_gentle_left = gauche légère
curve_gentle_right = droite légère
curve_gentle_left_long = gauche légère longue
curve_gentle_right_long = droite légère longue
curve_hard_left = gauche serrée
curve_hard_right = droite serrée
curve_hard_left_long = gauche serrée longue
curve_hard_right_long = droite serrée longue
curve_hairpin_left = épingle à gauche
curve_hairpin_right = épingle à droite
curve_hairpin_left_long = épingle à gauche longue
curve_hairpin_right_long = épingle à droite longue
curve_then = ", puis "

position_1 = position {n}
position_2 = position {n}
position_3 = position {n}
position_other = position {n}

lap = tour {n} sur {total}
finish = arrivée
finish_position = arrivée, {pos}

off_road = hors piste
on_road = sur la piste
wrong_way = sens inverse
