opt_effects_volume_help = Motori, oggetti e altri effetti della gara.
opt_ui_volume_help = I clic e i jingle dei menù del gioco.
opt_voices_volume_help = Le voci dei piloti.
opt_mute_help = Silenzia tutto il gioco. La voce dello screen reader e i segnali del mod continuano.
