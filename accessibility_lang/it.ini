# Mod di accessibilità di Mario Kart Wii — frasi in italiano.
# Modificabile liberamente: chiave = valore, UTF-8. {n}/{total}/{pos} li inserisce il mod.
# Racchiudi un valore tra "virgolette doppie" per conservare spazi iniziali o finali.
# Se manca una chiave o il file, si usa l'inglese integrato.

ready = Accessibilità di Mario Kart Wii pronta.
settings_reloaded = impostazioni ricaricate

update_mod = È disponibile una nuova versione di Mario Kart Wii Access. Premi Invio per aggiornare ora, o Esc per continuare a giocare.
update_retro_rewind = È disponibile una nuova versione di Retro Rewind. Premi Invio per aggiornare ora, o Esc per continuare a giocare.
update_mod_manual = È disponibile una nuova versione di Mario Kart Wii Access. Esegui l’installer nella cartella del gioco per aggiornare.
update_retro_rewind_manual = È disponibile una nuova versione di Retro Rewind. Esegui l’installer nella cartella del gioco per aggiornarla prima di giocare online.
update_declined = Si continua senza aggiornare.
update_starting = Avvio dell’installer. Il gioco verrà chiuso ora.
update_failed = Impossibile avviare l’installer.

