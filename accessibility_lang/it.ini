opt_resolution_help = Quanto è nitida l'immagine. I livelli 6x e 8x non sono disponibili mentre l'interpolazione dei fotogrammi è attiva.
opt_disable_bloom_help = Disattiva l'effetto di alone attorno alle zone luminose. Si applica dalla scena successiva.
opt_display_mode_help = Finestra, schermo intero senza bordi o schermo intero esclusivo. Se la modalità non può essere impostata, resta quella precedente.
opt_frame_interp_help = Rende la gara più fluida con fotogrammi extra. È sperimentale e può mostrare difetti visivi. Una risoluzione di 6x o 8x scende a 4x.
opt_disable_copy_filter_help = Salta il passaggio del filtro di copia del gioco quando disegna l'immagine.
opt_skip_unready_help = Omette gli oggetti i cui shader sono ancora in compilazione invece di fermare il gioco. Compaiono un istante dopo.
