# descrizioni: lette dopo il nome e il valore di ogni opzione
opt_mii_name_help = Il nome che gli altri giocatori vedono online; il tuo Mii lo porta. Premi A, scrivilo con la tastiera e premi Invio.
opt_master_volume_help = Volume di tutto il gioco: motore, musica ed effetti insieme. Il parlato dello screen reader non ne è influenzato.
opt_music_volume_help = Solo la musica di sottofondo. Motori ed effetti mantengono il proprio volume.
opt_kart_volume_help = Il tuo kart: motore, derapata e la voce del tuo pilota. Sopra cento è più forte del gioco originale, il che ti aiuta a sentire la guida di sterzata che vi è sovrapposta.
opt_rival_volume_help = I motori e le voci degli altri kart. Abbassalo per evitare che il gruppo copra il tuo motore.
opt_roulette_volume_help = Il giro della roulette degli oggetti e il jingle quando il tuo oggetto viene deciso. I clic dei menu non vengono toccati.
opt_edge_cue_volume_help = I bip vicino al bordo della strada e il tono continuo mentre sei fuori pista. Ogni passo riproduce il tono al nuovo livello.
opt_surface_cue_volume_help = La nota di quando il kart esce dalla pista e quella di quando rientra. Ogni passo la riproduce.
opt_curve_cue_volume_help = I bip che segnano l'ingresso, il vertice e l'uscita di una curva. Ogni passo ne riproduce uno.
opt_countdown_cue_volume_help = I tre bip crescenti che contano l'arrivo di una curva. Ogni passo ne riproduce uno.
opt_item_box_cue_volume_help = Il segnale che indica una scatola degli oggetti vicina quando sei senza oggetto. Ogni passo lo riproduce.
opt_invert_pan_help = Disattivato, il motore suona verso il lato da cui devi allontanarti sterzando. Attivato, si inverte, quindi sterzi verso il suono.
opt_steering_strength_help = Quanto forte panottizza il motore quando il kart non punta verso la linea ideale. Aumentala per un'oscillazione più ampia e netta, abbassala per un effetto più discreto.
opt_look_ahead_help = Quanto in anticipo nel tempo guarda il mod: un decimo di secondo a zero, gli otto decimi provati in gioco a cento, circa un secondo e mezzo a duecento. Aumentalo per essere avvisato prima delle curve e del bordo della pista, abbassalo per seguire ciò che accade in questo momento.
opt_steering_lean_angle_help = Di quanto il kart deve discostarsi dalla linea ideale perché il motore raggiunga il suo panning massimo. Abbassalo e il motore si sposta di più nella stessa curva; alzalo per un'inclinazione più morbida e graduale.
opt_edge_cues_help = Bip che accelerano man mano che ti avvicini al bordo della strada, e un tono continuo mentre sei fuori pista. Disattivandolo restano gli avvisi vocali di fuori pista e direzione sbagliata.
demo_edge_help = Riproduce il tono continuo che suona mentre il kart è fuori pista.
demo_curve_help = Riproduce il bip che segnala una curva in arrivo.
demo_itembox_help = Riproduce il segnale che indica una item box vicina mentre hai le mani vuote.

