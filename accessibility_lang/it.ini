# Mod di accessibilità di Mario Kart Wii — frasi in italiano.
# Modificabile liberamente: chiave = valore, UTF-8. {n}/{total}/{pos} li inserisce il mod.
# Racchiudi un valore tra "virgolette doppie" per conservare spazi iniziali o finali.
# Se manca una chiave o il file, si usa l'inglese integrato.

ready = Accessibilità di Mario Kart Wii pronta.
settings_reloaded = impostazioni ricaricate

curve_left = sinistra
curve_right = destra
curve_left_long = sinistra lunga
curve_right_long = destra lunga
curve_gentle_left = sinistra leggera
curve_gentle_right = destra leggera
curve_gentle_left_long = sinistra leggera lunga
curve_gentle_right_long = destra leggera lunga
curve_hard_left = sinistra stretta
curve_hard_right = destra stretta
curve_hard_left_long = sinistra stretta lunga
curve_hard_right_long = destra stretta lunga
curve_hairpin_left = tornante a sinistra
curve_hairpin_right = tornante a destra
curve_hairpin_left_long = tornante a sinistra lungo
curve_hairpin_right_long = tornante a destra lungo
curve_then = ", poi "

position_1 = posizione {n}
position_2 = posizione {n}
position_3 = posizione {n}
position_other = posizione {n}

lap = giro {n} di {total}
finish = traguardo
finish_position = traguardo, {pos}

off_road = fuori pista
off_road_fall = fuori pista, bordo del vuoto
on_road = in pista
wrong_way = contromano

# settings menu
menu_opened = impostazioni di accessibilità. Su e giù per scegliere, sinistra e destra per regolare, A per attivare, B per chiudere.
menu_closed = impostazioni chiuse
menu_race_blocked = le impostazioni si aprono dai menù, non durante la gara
opt_master_volume = volume generale
opt_music_volume = volume della musica
opt_steering_strength = forza della guida di sterzata
opt_look_ahead = anticipo
opt_invert_pan = inverti il panning
opt_edge_cues = segnali di bordo
demo_edge = ascolta il tono di bordo
demo_curve = ascolta un bip di curva
demo_itembox = ascolta la scatola oggetti
value_on = attivato
value_off = disattivato
percent = {n} per cento
opt_kart_volume = volume del mio kart
opt_rival_volume = volume dei kart rivali
opt_roulette_volume = volume della roulette degli oggetti

# descrizioni: lette dopo il nome e il valore di ogni opzione
opt_master_volume_help = Volume di tutto il gioco: motore, musica ed effetti insieme. Il parlato dello screen reader non ne è influenzato.
opt_music_volume_help = Solo la musica di sottofondo. Motori ed effetti mantengono il proprio volume.
opt_kart_volume_help = Il tuo kart: motore, derapata e la voce del tuo pilota. Sopra cento è più forte del gioco originale, il che ti aiuta a sentire la guida di sterzata che vi è sovrapposta.
opt_rival_volume_help = I motori e le voci degli altri kart. Abbassalo per evitare che il gruppo copra il tuo motore.
opt_roulette_volume_help = Il giro della roulette degli oggetti e il jingle quando il tuo oggetto viene deciso. I clic dei menu non vengono toccati.
opt_steering_strength_help = Quanto forte panottizza il motore quando il kart non punta verso la linea ideale. È la parte principale della guida: aumentala per un'oscillazione più ampia e netta, abbassala per un effetto più discreto.
opt_look_ahead_help = Quanto in anticipo nel tempo guarda il mod, da un decimo di secondo fino a circa otto decimi. Aumentalo per essere avvisato prima delle curve e del bordo della pista, abbassalo per seguire ciò che accade in questo momento.
opt_invert_pan_help = Disattivato, il motore suona verso il lato da cui devi allontanarti sterzando. Attivato, si inverte, quindi sterzi verso il suono.
opt_edge_cues_help = Bip che accelerano man mano che ti avvicini al bordo della strada, e un tono continuo mentre sei fuori pista. Disattivandolo restano gli avvisi vocali di fuori pista e direzione sbagliata.
demo_edge_help = Riproduce il tono continuo che suona mentre il kart è fuori pista.
demo_curve_help = Riproduce il bip che segnala una curva in arrivo.
demo_itembox_help = Riproduce il segnale che indica una item box vicina mentre hai le mani vuote.

