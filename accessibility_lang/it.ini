# Mod di accessibilità di Mario Kart Wii — frasi in italiano.
# Modificabile liberamente: chiave = valore, UTF-8. {n}/{total}/{pos} li inserisce il mod.
# Racchiudi un valore tra "virgolette doppie" per conservare spazi iniziali o finali.
# Se manca una chiave o il file, si usa l'inglese integrato.

ready = Accessibilità di Mario Kart Wii pronta.
settings_reloaded = impostazioni ricaricate

curve_left = sinistra
curve_right = destra
curve_left_long = sinistra lunga
curve_right_long = destra lunga
curve_gentle_left = sinistra leggera
curve_gentle_right = destra leggera
curve_gentle_left_long = sinistra leggera lunga
curve_gentle_right_long = destra leggera lunga
curve_hard_left = sinistra stretta
curve_hard_right = destra stretta
curve_hard_left_long = sinistra stretta lunga
curve_hard_right_long = destra stretta lunga
curve_hairpin_left = tornante a sinistra
curve_hairpin_right = tornante a destra
curve_hairpin_left_long = tornante a sinistra lungo
curve_hairpin_right_long = tornante a destra lungo
curve_then = ", poi "

position_1 = posizione {n}
position_2 = posizione {n}
position_3 = posizione {n}
position_other = posizione {n}

lap = giro {n} di {total}
finish = traguardo
finish_position = traguardo, {pos}

off_road = fuori pista
off_road_fall = fuori pista, bordo del vuoto
on_road = in pista
wrong_way = contromano

# settings menu
menu_opened = impostazioni di accessibilità. Su e giù per scegliere, sinistra e destra per regolare, A per attivare, B per chiudere.
menu_closed = impostazioni chiuse
menu_race_blocked = le impostazioni si aprono dai menù, non durante la gara
opt_master_volume = volume generale
opt_music_volume = volume della musica
opt_steering_strength = forza della guida di sterzata
opt_steering_sensitivity = sensibilità dello sterzo
opt_look_ahead = anticipo della guida
opt_position_gain = guadagno di scarto
opt_curve_accent = accento in curva
opt_invert_pan = inverti il panning
opt_edge_cues = segnali di bordo
demo_edge = ascolta il tono di bordo
demo_curve = ascolta un bip di curva
demo_itembox = ascolta la scatola oggetti
value_on = attivato
value_off = disattivato
percent = {n} per cento
opt_kart_volume = volume del mio kart
opt_rival_volume = volume dei kart rivali
opt_roulette_volume = volume della roulette degli oggetti
