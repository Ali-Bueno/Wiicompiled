opt_dolphin_import = importa i controlli da Dolphin
menu_wii_help = Wii Remote e Wii U Pro Controller via Bluetooth: interruttori, ricerca e calibrazione dell'accelerometro.
opt_port_help = Su quale delle quattro porte di gioco agiscono le voci seguenti. Sinistra e destra la cambiano.
opt_assign_controller_help = Sinistra e destra scelgono tra i controller collegati; A assegna quello scelto a questa porta.
opt_preset_gamecube_help = Ripristina la disposizione dei pulsanti GameCube sul controller di questa porta.
opt_preset_classic_help = Imposta i pulsanti del controller di questa porta sulla disposizione del Classic Controller Pro.
opt_preset_playstation_help = Imposta i pulsanti del controller di questa porta sulla disposizione PlayStation.
opt_vibration_help = Vibrazione per tutte le porte.
opt_keyboard_mouse_help = Gioca con tastiera e mouse su questa porta invece che con un controller. La prima volta imposta la disposizione WASD.
opt_wasd_preset_help = Imposta i tasti di tastiera e mouse sulla disposizione WASD. Richiede tastiera e mouse attivi.
opt_wii_use_help = Permette al gioco di usare Wii Remote e Wii U Pro Controller via Bluetooth. Ha effetto al prossimo avvio del gioco. Disattivalo se usi una Mayflash DolphinBar.
opt_wii_scan_help = Finché nessun controller Wii è collegato, controlla il Bluetooth ogni due secondi, così un telecomando disconnesso o acceso in ritardo torna da solo.
opt_wii_rescan_help = Cerca i Wii Remote ora. Premi 1 e 2 sul telecomando, oppure il pulsante rosso di sincronizzazione.
opt_wii_calibrate_help = Appoggia il telecomando su una superficie piana con i pulsanti verso l'alto e non toccarlo per circa due secondi. Corregge lo scarto dello sterzo di un telecomando tenuto di lato.
opt_wii_clear_calibration_help = Rimuove la correzione salvata dell'accelerometro.
opt_dolphin_import_help = Legge i controlli di questa porta dalle impostazioni dei controller GameCube di Dolphin e dice quanti sono stati importati.
